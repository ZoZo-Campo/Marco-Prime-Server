name: Build and Release (dist)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: marco-prime-frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: marco-prime-frontend
        run: pnpm install --frozen-lockfile
      - name: Build project
        working-directory: marco-prime-frontend
        run: pnpm build
      - name: Create archives
        working-directory: marco-prime-frontend/dist
        run: |
          tar -czf ../dist.tar.gz .
          zip -r ../dist.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            marco-prime-frontend/dist.tar.gz
            marco-prime-frontend/dist.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
