name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marco_prime_test
          MYSQL_USER: marco
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umarco -pci_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: marco-prime-backend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: marco-prime-backend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: marco-prime-backend
        run: pnpm audit --prod --audit-level high
      - name: Prepare test database
        working-directory: marco-prime-backend
        env:
          DATABASE_URL: mysql://marco:ci_test_password@127.0.0.1:3306/marco_prime_test
        run: |
          pnpm db:migrate
          pnpm db:security
      - name: Run backend tests
        working-directory: marco-prime-backend
        env:
          DATABASE_URL: mysql://marco:ci_test_password@127.0.0.1:3306/marco_prime_test
          API_AUTH_ENABLED: "true"
          API_TOKEN: marco-prime-test-token
          FOUAILLE_API_URL: ""
          FOUAILLE_SYNC_ENABLED: "false"
        run: pnpm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: marco-prime-frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: marco-prime-frontend
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: marco-prime-frontend
        run: pnpm audit --prod --audit-level high
      - name: Build frontend
        working-directory: marco-prime-frontend
        run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          tags: marco-prime-server:ci
