x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Le volume nommé appartient à root au premier démarrage. Ce service
  # one-shot le rend inscriptible par l'utilisateur non-root de l'application.
  data-permissions:
    image: marco-prime-server:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /app/data"]
    volumes:
      - marco_server_data:/app/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: marco-prime-server:local
    env_file: [.env.server]
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    expose: ["3000"]
    volumes:
      - marco_server_data:/app/data
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Valeurs de départ pour un petit serveur. À ajuster au matériel réel.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  https:
    image: caddy:2.10-alpine
    environment:
      MARCO_API_DOMAIN: ${MARCO_API_DOMAIN:?MARCO_API_DOMAIN is required}
      MARCO_TLS_DIRECTIVE: ${MARCO_TLS_DIRECTIVE:-tls internal}
      # Même jeton que l'API : Caddy l'injecte dans les requêtes vers `app`,
      # ce qui permet au navigateur de ne jamais le recevoir.
      MARCO_API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cas A (certificat fourni par l'école) : copier fullchain.pem et
      # privkey.pem dans ./certs/, puis décommenter la ligne suivante.
      # - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  marco_server_data:
  caddy_data:
  caddy_config:
