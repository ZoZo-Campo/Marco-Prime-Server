services:
  data-permissions:
    image: marco-prime-server:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /app/data"]
    volumes:
      - marco_server_data:/app/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: marco-prime-server:local
    env_file: [.env.server]
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    expose: ["3000"]
    volumes:
      - marco_server_data:/app/data
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  https:
    image: caddy:2.10-alpine
    env_file: [.env.server]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  marco_server_data:
  caddy_data:
  caddy_config:

