services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${MARCO_REMOTE_API_URL:?MARCO_REMOTE_API_URL is required}
        VITE_API_TOKEN: ${MARCO_API_TOKEN:?MARCO_API_TOKEN is required}
        VITE_WIFI_MANAGEMENT_ENABLED: "false"
    image: marco-prime-frontend:local
    ports:
      - "127.0.0.1:${MARCO_FRONTEND_PORT:-3001}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

