server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pas de configuration d'exécution sur ce mode : le build a figé
  # VITE_API_URL / VITE_API_TOKEN. Le mode `server` masque l'édition du .env
  # depuis l'interface (kiosque pointant vers l'API de l'école).
  location = /runtime-config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store";
    return 200 'window.MARCO_CONFIG = {"deployment":"server"};';
  }

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
